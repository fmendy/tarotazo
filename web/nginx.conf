# Tarotazo (arcana) — Nginx para el front estático (imagen nginx-unprivileged, UID 101).
# Privacidad: SIN access log. El error log va a stderr a nivel warn; además Nginx sólo ve
# la IP del proxy (Caddy), nunca la del usuario, porque NO se usa ngx_http_realip.
# Preparado para read_only: true -> todo lo escribible está en /tmp (tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log    off;
    log_not_found off;
    server_tokens off;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    # Sólo se sirven estáticos: no se aceptan cuerpos grandes.
    client_max_body_size 16k;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/manifest+json application/xml image/svg+xml font/ttf font/otf
               application/vnd.ms-fontobject;

    # Política de caché por ruta. Se calcula aquí para poder declarar TODAS las cabeceras
    # una sola vez en el server{} (add_header no se hereda si una location define otra).
    map $uri $arcana_cache_control {
        ~^/assets/            "public, max-age=31536000, immutable";  # nombres con hash de Vite
        ~^/fonts/             "public, max-age=31536000, immutable";
        ~^/art/               "public, max-age=2592000, stale-while-revalidate=86400";  # 30 días
        ~\.(ico|png|webp|avif|svg|webmanifest)$ "public, max-age=86400";
        default               "no-cache";                              # index.html y SPA
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Detrás de Caddy: redirecciones relativas, sin puerto interno.
        absolute_redirect off;
        port_in_redirect  off;

        # ---- Cabeceras de seguridad (always = también en 4xx/5xx) ----
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(), camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), display-capture=(), browsing-topics=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control $arcana_cache_control always;

        # Healthcheck del contenedor (y del proxy).
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # Ficheros ocultos fuera (salvo .well-known).
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # Estáticos: si no existen, 404 de verdad (nada de devolver index.html).
        location /assets/ { try_files $uri =404; }
        location /art/    { try_files $uri =404; }
        location /fonts/  { try_files $uri =404; }

        # El API no lo sirve Nginx: si llega aquí es un error de enrutado.
        location /api/ { return 404; }

        # SPA: cualquier otra ruta -> index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
