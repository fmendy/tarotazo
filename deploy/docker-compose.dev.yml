# Desarrollo local sin TLS en http://localhost:8080 (se superpone al principal):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build -d
services:
  proxy:
    environment:
      ARCANA_SITE: "http://:8080"
    ports: !override
      - "${ARCANA_DEV_PORT:-8080}:8080"

  arcana-api:
    environment:
      SPRING_PROFILES_ACTIVE: ${ARCANA_SPRING_PROFILES:-default}
